# CI: lint, tests, the safety evaluation, and container images.
# Every job runs on CPU: the GPU parts are tested with a fake engine here and against the real GPU by hand
# (backend/scripts/eval_system.py gemma, chaos_test.py chaos).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_gpu_image:
        description: "Also build the GPU inference image (12 GB, ~20 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:  # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # the version the containers run
  TORCH_CPU: "torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install "ruff>=0.6"
      - name: "Ruff (backend, rules from pyproject.toml)"
        run: ruff check backend/src backend/tests backend/scripts
      - name: Ruff (frontend)
        run: ruff check frontend

  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install (CPU PyTorch)
        run: |
          pip install ${{ env.TORCH_CPU }}
          pip install -e ".[api,dev]"
      - name: Tests (agents, policy, questions, signal quality, services)
        run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: backend/test-results.xml }

  safety-eval:
    # The promises the design makes, checked on every change: no finding below its screening tier, urgent windows
    # covered within budget, budgets respected, injected receiver faults caught, signal faults handled as expected.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install (CPU PyTorch)
        run: |
          pip install ${{ env.TORCH_CPU }}
          pip install -e ".[api]"
      - name: Invariants under injected faults (63 runs)
        run: python scripts/eval_system.py invariants
      - name: Signal faults (70 runs)
        run: python scripts/eval_system.py stress
      - name: Summary
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, pathlib
          print("## Safety evaluation")
          for name in ("invariants", "stress"):
              p = pathlib.Path(f"results/eval_{name}.json")
              if not p.exists():
                  print(f"- **{name}**: not run"); continue
              d = json.loads(p.read_text())
              extra = (f"{d['matches']}/{d['total']} expected outcomes" if name == "stress" else
                       ", ".join(f"fault rate {k}: {v['injected']} injected / {v['rejected']} caught"
                                 for k, v in d["summary"].items()))
              print(f"- **{name}**: {d['violations']} violations; {extra}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: safety-eval, path: "backend/results/eval_*.json" }

  frontend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: frontend/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - name: Page tests (Streamlit AppTest, fake API)
        run: pytest -q

  docker:
    needs: [lint, backend-tests, safety-eval, frontend-tests]  # images only from code that passed everything
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io on main
    strategy:
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile.api }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test the image
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          port=$([ "${{ matrix.name }}" = api ] && echo 8000 || echo 8501)
          path=$([ "${{ matrix.name }}" = api ] && echo /readyz || echo /_stcore/health)
          docker run -d --name smoke -p $port:$port "$image"
          for i in $(seq 1 30); do curl -sf "http://localhost:$port$path" && break; sleep 2; done
          curl -sf "http://localhost:$port$path"
          test "$(docker exec smoke id -un)" = app  # never root
      - name: Vulnerability scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"  # report; a policy gate (exit-code 1) is a later decision
          format: table

  gpu-image:
    # 12 GB of CUDA libraries: built on request, not on every push (runner disk ~14 GB free, no GPU to test it)
    if: github.event_name == 'workflow_dispatch' && inputs.build_gpu_image
    needs: [backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for CUDA layers
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the inference image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.inference
          push: false
          tags: ecg-triage/inference:ci

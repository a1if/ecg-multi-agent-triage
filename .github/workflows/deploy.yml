# Deploy to Cloud Run after CI passes on main. Build once, deploy many: the exact images CI tested (ghcr.io, tagged
# with the commit) are copied to Artifact Registry and rolled out; nothing is rebuilt here.
# Authentication is Workload Identity Federation: GitHub's OIDC token is exchanged for short-lived Google credentials
# of the deployer service account (infra/terraform/main.tf). No key is stored anywhere.
# Skipped until the repository variables from `terraform output github_variables` are set.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # pull the tested images from ghcr.io
  id-token: write # request the OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a rollout halfway

jobs:
  cloud-run:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ecg-triage
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Copy the tested images to Artifact Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          short=${SHA:0:7}
          for svc in api frontend; do
            src="ghcr.io/${{ github.repository }}/$svc:sha-$short"
            dst="$REGISTRY/$svc:sha-$short"
            docker pull "$src" && docker tag "$src" "$dst" && docker push "$dst"
          done
      - name: "Roll out (API first: the frontend depends on it)"
        run: |
          short=${SHA:0:7}
          for svc in api frontend; do
            gcloud run deploy "ecg-$svc" --image "$REGISTRY/$svc:sha-$short" \
              --region "${{ vars.GCP_REGION }}" --quiet
          done
      - name: Smoke test the public URL
        run: |
          url=$(gcloud run services describe ecg-frontend --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          for _ in $(seq 1 20); do curl -sf "$url/_stcore/health" && break; sleep 5; done
          curl -sf "$url/_stcore/health"
          echo "Deployed sha-${SHA:0:7}: $url" >> "$GITHUB_STEP_SUMMARY"

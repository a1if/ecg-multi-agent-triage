[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-agent"
version = "0.1.0"
description = "Two-agent ECG triage: a CNN-LSTM perception agent and a Gemma reasoning agent that talk over text or virtual tokens"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "torch>=2.4",
    "wfdb>=4.1",
    "langgraph>=0.4",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.1", "python-multipart>=0.0.9"]
# Gemma 4 is multimodal: its processor imports the image pipeline, so torchvision + pillow are required even for text.
inference = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "transformers>=5.0", "accelerate>=1.0",
             "bitsandbytes>=0.45", "huggingface-hub>=0.30", "torchvision", "pillow", "nvidia-ml-py"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
mlops = ["mlflow>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: needs a CUDA GPU and access to Gemma"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]
# vendored unchanged from the research repo
"src/ecg_agent/core/decoding.py" = ["E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

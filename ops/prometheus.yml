# Scrapes both services' /metrics (agent runs, tool calls, guardrail verdicts, receiver latency and tokens, GPU memory)
global:
  scrape_interval: 10s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml  # model-quality and data-drift alerts (tested: ops/alerts_test.yml)
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: inference
    static_configs: [{ targets: ["inference:8001"] }]

# Same rules as the backend (backend/pyproject.toml), so local and CI lint agree.
line-length = 125
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E741", "B008"]

[lint.isort]
known-first-party = ["api", "ui"]  # the frontend's own modules, imported by the page scripts
